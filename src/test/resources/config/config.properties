# ---------------------------------------------------------------
# Framework configuration.
# Any key can be overridden from the command line: -Dbrowser=firefox
# ---------------------------------------------------------------

# Application under test (public site, no login needed)
base.url=https://books.toscrape.com/

# Browser: chrome | firefox | edge
browser=chrome
headless=true

# Execution mode: local | grid
execution=local
grid.url=http://localhost:4444

# Explicit wait / page load timeouts in seconds
explicit.wait=15
page.load.timeout=30

# Attach a screenshot to the report after every scenario (failures are ALWAYS captured)
screenshot.on.pass=true
